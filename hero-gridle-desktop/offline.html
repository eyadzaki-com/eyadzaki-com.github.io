<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Hero Gridle — Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; color: #fff; background: #020a12; font: 16px system-ui, sans-serif; }
    main { max-width: 520px; padding: 40px; text-align: center; }
    .mark { display: grid; place-items: center; width: 112px; height: 112px; margin: auto; border-radius: 24px; background: linear-gradient(135deg, #08f, #e03 50%, #fc0); font-size: 36px; font-weight: 900; }
    p { color: #aac0d4; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">HG</div>
    <h1>You're offline</h1>
    <p>Hero Gridle needs an internet connection. Reconnect, close the app, and open it again.</p>
  </main>
</body>
</html>
