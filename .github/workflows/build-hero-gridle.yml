name: Build Hero Gridle EXE

on:
  push:
    branches: [main]
    paths:
      - "hero-gridle-desktop/**"
      - ".github/workflows/build-hero-gridle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hero-gridle-desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate application source
        run: npm run check

      - name: Build Windows installer
        run: npm run dist

      - name: Record installer hash
        shell: pwsh
        run: |
          Get-FileHash dist\HeroGridle-Setup-*.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HeroGridle-Windows-Installer
          path: hero-gridle-desktop/dist/HeroGridle-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
